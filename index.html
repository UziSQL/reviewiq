<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F5F2EA; --paper2:#EFEBE1; --slip:#FBF9F4; --ink:#1D1C1A; --ink2:#3B3934; --muted:#5E5A52;
  --rule:#CFC8B8; --slip-rule:#D6CFBF; --dash:#BFB7A5; --field:#858076; --track:#A39B8B; --hover:#ECE7DA;
  --green:#1F5C4A; --green-d:#174838; --on-green:#F7F5EF; --ochre:#B9822F;
  /* Fallbacks are system families with full Kazakh Cyrillic coverage (Әә Ғғ Ққ Ңң Өө Ұұ Үү Һһ Іі). */
  --serif:'IBM Plex Serif','PT Serif','Noto Serif',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans','PT Sans','Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;
  --mono:'IBM Plex Mono','PT Mono','Noto Sans Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;
}
html,body{margin:0;background:var(--paper);color:var(--ink)}
*{box-sizing:border-box}
a{color:var(--green);text-decoration:underline;text-underline-offset:3px}
a:hover{color:var(--green-d)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
::placeholder{color:#77726A}
button{font-family:inherit}
@keyframes riq-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.anim{animation:riq-in 180ms ease-out both}
.anim-s{animation:riq-in 200ms ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.riq{container-type:inline-size;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding-left:clamp(20px,5cqi,64px);padding-right:clamp(20px,5cqi,64px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.kicker{margin:0;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kicker.b{font-weight:600}
.help{margin:0 0 10px;font-size:14px;color:var(--muted)}
.lbl{display:block;font-weight:600;margin:0 0 2px}

/* header */
.hdr{border-bottom:1px solid var(--ink)}
.hdr .wrap{padding-top:14px;padding-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.wordmark{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em}
.tagline{font-size:14px;color:var(--muted)}
.langsw{display:flex;align-items:center;gap:10px}
.langsw-l{font-size:13px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{min-height:44px;min-width:60px;padding:0 14px;border:0;font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;background:transparent;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.draft{border-bottom:1px solid var(--rule);background:var(--paper2)}
.draft p{margin:0 auto;padding-top:8px;padding-bottom:8px;font-family:var(--mono);font-size:13px;color:var(--ink2)}

/* fields */
.input,.textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--slip);border:1px solid var(--field);border-radius:3px}
.input{min-height:48px;padding:10px 14px}
.textarea{resize:vertical}
.input[aria-invalid="true"],.textarea[aria-invalid="true"]{border:2px solid var(--ink)}
.msg{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;font-size:15px;font-weight:500}
.tag{flex:none;margin-top:2px;padding:2px 6px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:2px}
.okline{margin:0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--green)}
.oktag{padding:3px 8px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--green);color:var(--on-green);border-radius:2px}

/* buttons */
.btn{font-family:inherit;line-height:1.3;text-align:left;white-space:normal;border-radius:3px;cursor:pointer}
.btn-p{min-height:52px;padding:13px 24px;font-size:17px;font-weight:600;color:var(--on-green);background:var(--green);border:1px solid var(--green)}
.btn-p:hover{background:var(--green-d);border-color:var(--green-d)}
.btn-s{min-height:52px;padding:13px 20px;font-size:16px;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--ink)}
.btn-s:hover,.btn-o:hover,.btn-sm:hover{background:var(--hover)}
.btn-o{min-height:48px;padding:12px 20px;font-size:16px;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--ink)}
.btn-sm{min-height:44px;padding:10px 18px;font-size:15px;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--ink)}
.btn-link{min-height:44px;padding:10px 0;font-family:inherit;font-weight:500;color:var(--green);background:none;border:0;text-decoration:underline;text-underline-offset:4px;cursor:pointer;text-align:left}
.btn-link:hover{color:var(--green-d)}

/* entry */
.entry{padding-top:clamp(36px,6cqi,72px)}
.notice{margin:0 0 28px;padding:10px 0;border-top:1px solid var(--green);border-bottom:1px solid var(--green);color:var(--green);font-weight:600}
.h1{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:-.015em;text-wrap:balance}
.entry .h1{max-width:820px;font-size:clamp(32px,4.6cqi,56px);line-height:1.08}
.lede{margin:18px 0 0;max-width:640px;font-size:18px;color:var(--ink2);text-wrap:pretty}
.entry-grid{display:flex;flex-wrap:wrap;gap:48px clamp(32px,6cqi,80px);margin-top:clamp(36px,5cqi,56px);padding-bottom:72px}
.entry-form{flex:7 1 460px;min-width:0;display:flex;flex-direction:column;gap:30px}
#venue{max-width:480px}
#reviews{min-height:280px;padding:14px;font-size:15px;line-height:1.6}
.counter{margin:8px 0 0;font-family:var(--mono);font-size:13px;color:var(--muted)}
.perm{display:flex;gap:14px;align-items:flex-start;min-height:44px;padding:10px 0;cursor:pointer;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.perm.bad{border-bottom:2px solid var(--ink)}
.perm input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--green);cursor:pointer}
.perm span{font-weight:500}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.entry .btn-link{font-size:15px}
.how{flex:4 1 260px;min-width:0;border-top:1px solid var(--ink);padding-top:18px;align-self:flex-start}
.h2s{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:22px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;padding:14px 0;border-bottom:1px solid var(--rule)}
.steps .n{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--green)}
.steps .x{font-size:15px;text-wrap:pretty}
.how h3{margin:26px 0 6px}
.how .p{margin:0;font-size:15px}

/* results */
.results{padding-top:clamp(32px,5cqi,56px)}
.results > .kicker{margin-bottom:12px}
.results .h1{max-width:900px;font-size:clamp(30px,4.2cqi,50px);line-height:1.1;outline:none}
.stats{display:flex;flex-wrap:wrap;gap:0 clamp(24px,5cqi,64px);margin:clamp(28px,4cqi,44px) 0 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.stats > div{flex:1 1 140px;display:flex;flex-direction:column-reverse;padding:18px 0 20px}
.stats dt{margin-top:6px;font-size:15px;color:var(--ink2);max-width:16em}
.stats dd{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(52px,7cqi,88px);line-height:1;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
.notes{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 20px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.res-grid{display:flex;flex-wrap:wrap;align-items:flex-start;gap:40px clamp(32px,5cqi,64px);margin-top:clamp(40px,5cqi,60px)}
.res-main{flex:7 1 440px;min-width:0}
.res-main > .kicker{margin-bottom:14px}
.ledger{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule)}
.ledger > li{display:grid;grid-template-columns:minmax(52px,auto) minmax(0,1fr);column-gap:clamp(16px,2.6cqi,32px);padding:26px 0 22px;border-top:1px solid var(--rule)}
.ledger > li:first-child{border-top-color:var(--ink)}
.rank{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.6cqi,58px);line-height:.95;font-variant-numeric:tabular-nums lining-nums;color:var(--ink)}
.ledger > li.open .rank{color:var(--green)}
.tname{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(22px,2.4cqi,28px);line-height:1.2}
.countrow{display:flex;align-items:center;gap:14px;margin-top:10px}
.countrow .c{flex:none;font-family:var(--mono);font-size:14px;font-weight:500}
.bar{flex:1 1 auto;max-width:300px;min-width:48px;display:flex;align-items:center;height:4px}
.bar .f{height:3px;background:var(--green)}
.bar .r{height:1px;flex:1;background:var(--track)}
.check{margin:16px 0 0;max-width:62ch;text-wrap:pretty}
.check .kicker{display:block;margin-bottom:3px}
.toggle{margin-top:6px;font-size:16px;font-weight:600;text-decoration-thickness:1px}
.inline-ev{grid-column:1 / -1;margin-top:14px;padding-top:16px;border-top:2px solid var(--ink)}
.ev-hint{margin:4px 0 0;font-size:14px;color:var(--muted)}
.slips{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.slip{background:var(--slip);border:1px solid var(--slip-rule);border-radius:2px;padding:10px 16px 14px}
.inline-ev .slip{padding:10px 14px 14px}
.slip-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:8px;margin-bottom:10px;border-bottom:1px dashed var(--dash);font-family:var(--mono);font-size:13px}
.slip-h .id{font-weight:600}
.slip-h .lg{padding:0 6px;line-height:20px;font-size:12px;border:1px solid var(--muted);border-radius:2px;color:var(--ink2)}
.slip-t{margin:0;font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.slip-t mark{background:rgba(185,130,47,.2);color:inherit;border-bottom:2px solid var(--ochre);padding:0 1px}
.slip-k{margin:10px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.others{margin:14px 0 0;font-size:14px;color:var(--ink2)}
.others b{font-weight:600}
.others .mono{font-size:13px}
.panel{flex:5 1 320px;min-width:0;position:sticky;top:24px;border-top:2px solid var(--ink);padding-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:6px}
.panel-h h3{margin:0;font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.2}
.panel-h h3 span{display:block;margin-top:4px;font-family:var(--mono);font-size:13px;font-weight:400;color:var(--muted)}
.panel-x{flex:none;min-height:44px;padding:8px 12px;font-size:14px;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--field);border-radius:3px;cursor:pointer}
.panel-x:hover{background:var(--hover)}
.panel .ev-hint{margin-top:8px}
.panel .slips{margin-top:16px}
.panel-empty{margin:10px 0 0;max-width:34em;font-size:15px;color:var(--ink2)}
.empty{margin-top:clamp(40px,5cqi,60px);padding-top:24px;border-top:2px solid var(--ink);max-width:760px}
.empty h2{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(24px,3cqi,32px);line-height:1.2}
.empty .body{margin:12px 0 0;font-size:18px;text-wrap:pretty}
.empty .un{margin:14px 0 0;font-family:var(--mono);font-size:14px}
.empty .others{margin-top:6px}
.empty .btn-o{margin-top:20px}
.empty .slips{margin-top:20px}

/* action + feedback */
.band{padding-top:22px;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:20px clamp(24px,5cqi,64px)}
.band-l{flex:3 1 220px;min-width:0}
.band-l .kicker{margin-bottom:8px}
.band-l h2{margin:0;font-family:var(--serif);font-weight:500;line-height:1.2;text-wrap:balance}
.act{margin-top:72px}
.act .band-l h2{font-size:clamp(24px,2.8cqi,30px)}
.band-l .note{margin:10px 0 0;font-size:15px;color:var(--ink2)}
.band-r{flex:8 1 420px;min-width:0}
.act-form{display:flex;flex-direction:column;gap:26px}
fieldset{margin:0;padding:0;border:0;min-width:0;outline:none}
legend{padding:0;margin:0 0 8px;font-weight:600}
.opts{border-bottom:1px solid var(--rule)}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:14px;padding:14px 0;min-height:44px;border-top:1px solid var(--rule);cursor:pointer}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--green);cursor:pointer}
.opt b{display:block;font-weight:600}
.opt i{display:block;font-style:normal;margin-top:2px;color:var(--ink2);text-wrap:pretty}
.pair{display:flex;flex-wrap:wrap;gap:22px 24px}
.pair > div:first-child{flex:1 1 240px;min-width:0}
.pair > div:last-child{flex:1 1 200px;min-width:0}
.pair .help{margin-bottom:8px}
#date{font-family:var(--mono)}
.saved{background:var(--slip);border:1px solid var(--slip-rule);border-top:3px solid var(--green);border-radius:2px;padding:16px 20px 20px}
.saved .head{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.saved .head span:last-child{font-weight:600;color:var(--green)}
.saved .nm{margin:14px 0 0;font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.25}
.saved .ck{margin:6px 0 0;max-width:62ch}
.saved dl{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:6px 20px;margin:16px 0 0;padding-top:12px;border-top:1px dashed var(--dash);font-size:15px}
.saved dt{color:var(--muted)}
.saved dd{margin:0;font-weight:500}
.saved .btn-sm{margin-top:16px}
.fb{margin-top:64px}
.fb .band-l h2{font-size:clamp(22px,2.6cqi,28px);line-height:1.25}
.fb .band-r{display:flex;flex-direction:column;gap:24px}
.rates{display:flex;flex-wrap:wrap;gap:8px}
.rates button{width:60px;height:56px;font-family:var(--mono);font-size:20px;font-weight:600;border-radius:3px;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--ink)}
.rates button:hover{background:var(--hover)}
.rates button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.scale{display:flex;justify-content:space-between;gap:12px;max-width:332px;margin-top:8px;font-size:13px;color:var(--muted)}
.scale span:last-child{text-align:right}
#comment{min-height:96px;padding:12px 14px}
.fb .help{margin-bottom:8px}
.status{display:flex;flex-direction:column;gap:8px}
.status .okline span:last-child{font-weight:500;overflow-wrap:anywhere}
.tail{margin-top:64px;padding:20px 0;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:12px}
#resetBtn[data-armed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
#resetBtn[data-armed="true"]:hover{background:var(--ink2)}
.tail .hint{align-self:center;font-size:14px;color:var(--ink2)}
.ftr{border-top:1px solid var(--rule);margin-top:24px}
.ftr p{margin:0 auto;padding-top:18px;padding-bottom:28px;font-family:var(--mono);font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app" class="riq"></div>
<script>
(function () {
  'use strict';

  var VERSION = '1.0';

  /* ======================================================================
   * TOPIC DICTIONARY — extend here.
   * id:        stable identifier (used in export and events)
   * keywords:  lowercase substrings; matched case-insensitively (toLocaleLowerCase)
   * name/check: EN and KK text. These are merged into i18n as
   *            topic_<id>_name / topic_<id>_check so all rendering goes through i18n.
   * Order matters: ties in the ranking keep this order.
   * ==================================================================== */
  var TOPICS = [
    { id: 'wait', keywords: ['долго ждали', 'күттік ұзақ', 'кешікті'],
      name: { en: 'Waiting time', kk: 'Күту уақыты' },
      check: { en: 'Measure order-to-service time across ten peak-hour orders before changing staffing.',
               kk: 'Қызметкерлер санын өзгертпес бұрын, қарбалас сағаттағы он тапсырыс бойынша тапсырыс пен қызмет көрсету арасындағы уақытты өлшеңіз.' } },
    { id: 'staff', keywords: ['грубил', 'дөрекі'],
      name: { en: 'Staff interaction', kk: 'Қызметкерлердің қарым-қатынасы' },
      check: { en: 'Review two relevant shifts with the manager and agree on a service response standard.',
               kk: 'Қатысты екі ауысымды менеджермен бірге талдап, қонаққа жауап беру стандартын келісіңіз.' } },
    { id: 'food', keywords: ['холодная', 'суық'],
      name: { en: 'Food temperature', kk: 'Тағам температурасы' },
      check: { en: 'Check serving temperature and hand-off delays on the next shift.',
               kk: 'Келесі ауысымда тағамның берілу температурасын және асханадан залға беру кідірістерін тексеріңіз.' } }
  ];

  var LIMITS = { minReviews: 3, maxReviews: 200, maxReviewLength: 4000, maxVenue: 80, maxPerson: 80, maxComment: 2000,
    recurringThreshold: 2, maxTopicsShown: 3, exploratoryBelow: 30 };

  /* ======================================================================
   * UI STRINGS
   * ==================================================================== */
  const i18n = {
    en: {
      langNameEn: 'English', langNameKk: 'Қазақша', langCodeEn: 'EN', langCodeKk: 'ҚАЗ',
      tagline: 'Review priorities for independent cafés', langLabel: 'Language', draftNote: '',
      entryKicker: 'New session', headline: 'What should your café investigate first?',
      lede: 'Paste recent reviews from 2GIS or Google Maps. ReviewIQ groups them into recurring topics and shows the reviews behind each one.',
      venueLabel: 'Venue name', venueHelp: 'Shown in the report title. Up to 80 characters.', venuePh: 'e.g. Baqsha Café, Astana',
      reviewsLabel: 'Paste reviews, one per line', reviewsHelp: 'Russian, Kazakh or mixed. 3–200 unique reviews, up to 4,000 characters each.',
      reviewsPh: 'Ждали заказ 40 минут…\nТағам дәмді, бірақ…',
      counter: '{lines} lines · {u} unique · {d} duplicates', counterEmpty: 'No reviews yet',
      demoNote: 'Demo reviews are fictional.',
      permLabel: 'I have permission to use these reviews and removed personal details.',
      submit: 'Find recurring topics', demo: 'Load demo reviews', demoEmpty: 'Load a demo set with no repeats',
      errTag: 'Error', hintTag: 'Missing',
      errPerm: 'Tick this box to continue. Use only reviews you are allowed to use, with names and phone numbers removed.',
      errFew: 'Add at least 3 unique reviews. Right now there are {u}.',
      errMany: 'Use no more than 200 unique reviews. Right now there are {u}. Remove the oldest ones.',
      errLong: 'Review {id} is longer than 4,000 characters ({len}). Shorten it or split it into two lines.',
      errVenue: 'Enter the venue name. It appears in the report title.',
      errVenueLong: 'The venue name can be at most 80 characters.',
      howTitle: 'How it works',
      step1: 'Paste reviews you collected from 2GIS or Google Maps.',
      step2: 'Each review is checked against a dictionary of café topics in Russian and Kazakh. A topic is listed only if it appears in at least two reviews.',
      step3: 'Read the source reviews, choose one check, and set a person and a date.',
      limitsTitle: 'Limits', limits: 'This prototype uses a keyword dictionary, not an AI model. Nothing is sent to a server.',
      limits2: 'It can miss sarcasm or unusual wording. Always read the source reviews.',
      limits3: 'Counts are keyword matches, not proof of business impact. Demo reviews are fictional.',
      pilotTitle: 'Pilot', pilot: '7-day trial, then optional 7,000 KZT / month. No payment is collected in this app.',
      resultsKicker: 'Report · {date}', resultsTitle: '{venue} — review priorities',
      sumUnique: 'unique reviews', sumTopics: 'recurring topics', sumUnmatched: 'reviews without a match',
      dupes0: 'No duplicates found.', dupes1: '1 exact duplicate removed.', dupesN: '{n} exact duplicates removed.',
      methodNote: 'Counted with a keyword dictionary, threshold: 2 reviews. Counts are matches, not proof of business impact.',
      exploratory: 'Exploratory sample: fewer than 30 reviews.',

  /* ======================================================================
   * ANALYSIS (pure functions)
   * ==================================================================== */
  function fmt(s, v) { return String(s).replace(/\{(\w+)\}/g, function (m, k) { return v && v[k] !== undefined ? v[k] : m; }); }

  /** split → trim → drop empty → NFC → exact de-duplication (first occurrence wins) */
  function parse(raw) {
    var uniq = [], seen = new Set(), lines = 0, dupes = 0;
    String(raw || '').split(/\r\n|\r|\n/).forEach(function (l) {
      l = l.trim().normalize('NFC');
      if (!l) return;
      lines++;
      if (seen.has(l)) dupes++; else { seen.add(l); uniq.push(l); }
    });
    return { lines: lines, uniq: uniq, dupes: dupes };
  }

  function makeId(i, total) { return 'R' + String(i + 1).padStart(total > 99 ? 3 : 2, '0'); }

  function detectLang(text) {
    var low = text.toLocaleLowerCase();
    var kz = KZ_LETTERS.test(low);
    if (kz) {
      var toks = low.split(/[^\p{L}]+/u);
      return toks.some(function (w) { return RU_COMMON.has(w); }) ? 'mixed' : 'kz';
    }
    return /[а-яё]/.test(low) ? 'ru' : 'other';
  }

  function analyze(uniq, dupes, lines) {
    var reviews = uniq.map(function (text, i) {
      var low = text.toLocaleLowerCase(), topics = [];
      TOPICS.forEach(function (tp) {
        if (tp.keywords.some(function (k) { return low.indexOf(k) !== -1; })) topics.push(tp.id);
      });
      return { id: makeId(i, uniq.length), text: text, lang: detectLang(text), topics: topics };
    });
    var counts = TOPICS.map(function (tp, order) {
      return { id: tp.id, order: order, ids: reviews.filter(function (r) { return r.topics.indexOf(tp.id) !== -1; }).map(function (r) { return r.id; }) };
    });
    var matched = counts.filter(function (c) { return c.ids.length > 0; });
    matched.sort(function (a, b) { return b.ids.length - a.ids.length || a.order - b.order; }); // stable: ties keep dictionary order
    var recurring = matched.filter(function (c) { return c.ids.length >= LIMITS.recurringThreshold; });
    var shown = recurring.slice(0, LIMITS.maxTopicsShown);
    return {
      reviews: reviews, topics: shown, recurringTotal: recurring.length,
      others: matched.filter(function (c) { return shown.indexOf(c) === -1; }),
      topicCounts: counts.map(function (c) { return { id: c.id, count: c.ids.length }; }),
      unmatched: reviews.filter(function (r) { return !r.topics.length; }).length,
      total: reviews.length, dupes: dupes, lines: lines

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  /**
   * Highlight keywords safely: the review text is HTML-escaped FIRST, then keyword
   * ranges are wrapped in <mark>. Keywords contain no HTML-special characters, so a
   * match can never fall inside an escape entity.
   */
  function highlight(text, topicIds) {
    var safe = esc(text), low = safe.toLocaleLowerCase(), ranges = [], found = [];
    if (low.length !== safe.length) return { html: safe, found: found };
    TOPICS.forEach(function (tp) {
      if (topicIds.indexOf(tp.id) === -1) return;
      tp.keywords.forEach(function (k) {
        var idx = low.indexOf(k);
        while (idx !== -1) {
          ranges.push({ s: idx, e: idx + k.length });
          var w = safe.slice(idx, idx + k.length);
          if (found.indexOf(w) === -1) found.push(w);
          idx = low.indexOf(k, idx + k.length);
        }
      });
    });
    ranges.sort(function (a, b) { return a.s - b.s; });
    var merged = [];
    ranges.forEach(function (r) { var l = merged[merged.length - 1]; if (l && r.s <= l.e) l.e = Math.max(l.e, r.e); else merged.push({ s: r.s, e: r.e }); });
    var out = '', p = 0;
    merged.forEach(function (r) { out += safe.slice(p, r.s) + '<mark>' + safe.slice(r.s, r.e) + '</mark>'; p = r.e; });
    return { html: out + safe.slice(p), found: found };
  }

  /* ======================================================================
   * RENDER
   * ==================================================================== */
  function render(opts) {
    var a = document.activeElement, focusId = a && a.id && root.contains(a) ? a.id : null, sel = null, ta = null;
    if (focusId && typeof a.selectionStart === 'number' && a.type !== 'date') { try { sel = [a.selectionStart, a.selectionEnd]; } catch (e) {} }
    if (focusId && a.tagName === 'TEXTAREA') ta = a.scrollTop;

    document.documentElement.lang = state.lang;
    document.title = state.screen === 'results' && state.result ? tf('resultsTitle', { venue: state.venue.trim() }) + ' · ReviewIQ' : 'ReviewIQ';
    root.setAttribute('lang', state.lang);
    root.innerHTML = headerHTML() +
      '<main class="wrap">' + (state.screen === 'results' && state.result ? resultsHTML() : entryHTML()) + '</main>' +
      footerHTML();
    applyI18n(root);
    flash = {};

    if (focusId && !opts.noRestore) {
      var el = document.getElementById(focusId);
      if (el) {
        el.focus({ preventScroll: true });
        if (sel) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
        if (ta != null) el.scrollTop = ta;
      }
    }
  }

  /** Static binding: data-i18n → text, data-i18n-placeholder → placeholder, data-i18n-aria → aria-label. */
  function applyI18n(scope) {
    var T = t();
    scope.querySelectorAll('[data-i18n]').forEach(function (el) { var k = el.getAttribute('data-i18n'); if (k in T) el.textContent = T[k]; });
    scope.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) { var k = el.getAttribute('data-i18n-placeholder'); if (k in T) el.setAttribute('placeholder', T[k]); });
    scope.querySelectorAll('[data-i18n-aria]').forEach(function (el) { var k = el.getAttribute('data-i18n-aria'); if (k in T) el.setAttribute('aria-label', T[k]); });
  }

  /* ======================================================================
   * ACTIONS
   * ==================================================================== */
  function submit() {
    var s = state, p = parse(s.raw), e = {}, order = [];
    // a. permission
    if (!s.perm) { e.perm = true; order.push('perm'); logEvent('validation_error', { errorType: 'permission_missing' }); }
    // b. count, c. length (one message per field; count wins)
    if (p.uniq.length < LIMITS.minReviews) e.reviews = { code: 'few', u: p.uniq.length };
    else if (p.uniq.length > LIMITS.maxReviews) e.reviews = { code: 'many', u: p.uniq.length };
    else {
      for (var i = 0; i < p.uniq.length; i++) {
        if (p.uniq[i].length > LIMITS.maxReviewLength) { e.reviews = { code: 'long', id: makeId(i, p.uniq.length), len: p.uniq[i].length }; break; }
      }
    }
    if (e.reviews) {
      order.push('reviews');
      logEvent('validation_error', { errorType: e.reviews.code === 'few' ? 'too_few_reviews' : e.reviews.code === 'many' ? 'too_many_reviews' : 'review_too_long' });
    }
    // d. venue
    var v = s.venue.trim();
    if (!v) e.venue = 'errVenue'; else if (v.length > LIMITS.maxVenue) e.venue = 'errVenueLong';
    if (e.venue) { order.push('venue'); logEvent('validation_error', { errorType: e.venue === 'errVenue' ? 'venue_empty' : 'venue_too_long' }); }

    if (order.length) { set({ errors: e, notice: null }); focusLater(order[0]); return; }

    var result = analyze(p.uniq, p.dupes, p.lines);
    logEvent('analysis_completed', { reviewCount: result.total, recurringTopics: result.recurringTotal });
    set(Object.assign(blank(), { venue: s.venue, raw: s.raw, perm: s.perm, result: result, screen: 'results' }), { noRestore: true });
    window.scrollTo(0, 0);
    var h = document.getElementById('resTitle'); if (h) h.focus({ preventScroll: true });
  }

  function exportFileName() {
    var d = new Date();
    return 'ReviewIQ_session_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json';
  }

  /** Builds the export object. Deliberately contains no review text. */
  function buildExport() {
    var s = state, r = s.result;
    return {
      prototypeVersion: 'ReviewIQ MVP v' + VERSION,
      exportedAt: new Date().toISOString(),
      interfaceLanguage: s.lang,
      venue: s.venue.trim(),
      reviewCount: r.total,
      duplicatesRemoved: r.dupes,
      topicCounts: r.topicCounts,
      recurringTopicIds: r.topics.map(function (x) { return x.id; }),
      unmatchedCount: r.unmatched,
      action: s.actSaved ? { topicId: s.actSaved.topic, personResponsible: s.actSaved.person, reviewDate: s.actSaved.date, savedAt: s.actSaved.savedAt } : null,
      feedback: s.fbData,
      events: events.slice()
    };
  }

  function exportSession() {
    var file = exportFileName();
    logEvent('session_exported', { file: file });
    var json = JSON.stringify(buildExport(), null, 2);
    try {
      var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      var a = document.createElement('a'); a.href = url; a.download = file; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) { /* download blocked: confirmation still shown */ }
    flash.exported = true;
    set({ exported: file });
  }

  function openEvidence(id) {
    flash.panel = true;
    logEvent('evidence_opened_' + id);
    set({ openTopic: id }, { noRestore: true });
    var h = document.getElementById('evHeading');
    if (h) h.focus();
  }

  function closeEvidence() {
    var id = state.openTopic;
    if (!id) return;
    set({ openTopic: null }, { noRestore: true });
    var b = document.getElementById('tgl-' + id); if (b) b.focus();
  }

  var ACTIONS = {
    lang: function (v) {
      if (v === state.lang) return;
      storeLang(v);
      logEvent('language_switched', { to: v });
      set({ lang: v });
    },
    demo: function () {
      logEvent('demo_loaded', { set: 'recurring' });
      set({ venue: DEMO.venue, raw: DEMO.raw, perm: false, errors: {}, notice: null });
    },
    demoEmpty: function () {
      logEvent('demo_loaded', { set: 'no_repeats' });
      set({ venue: DEMO_EMPTY.venue, raw: DEMO_EMPTY.raw, perm: false, errors: {}, notice: null });
    },
    toggle: function (id) { if (state.openTopic === id) set({ openTopic: null }); else openEvidence(id); },
    closePanel: closeEvidence,
    showAll: function () { if (!state.showAll) flash.showAll = true; set({ showAll: !state.showAll }); },
    saveAction: function () {
      var a = state.act, e = {};
      if (!a.topic) e.topic = true;
      if (!a.person.trim()) e.person = true;
      if (!a.date || !/^\d{4}-\d{2}-\d{2}$/.test(a.date)) e.date = true;
      if (e.topic || e.person || e.date) {
        logEvent('validation_error', { errorType: 'action_incomplete', missing: Object.keys(e) });
        set({ actErr: e }); focusLater(e.topic ? 'actField' : e.person ? 'person' : 'date'); return;
      }
      var saved = { topic: a.topic, person: a.person.trim(), date: a.date, savedAt: new Date().toISOString() };
      logEvent('action_saved', { topicId: a.topic });
      flash.actSaved = true;
      set({ actErr: {}, actSaved: saved }, { noRestore: true });
      var box = document.getElementById('actSaved'); if (box) box.focus({ preventScroll: true });
    },
    editAction: function () { set({ actSaved: null }, { noRestore: true }); focusLater('actField'); },
    rate: function (n) { set({ fb: Object.assign({}, state.fb, { rating: Number(n) }), fbErr: false, fbSaved: false }); },
    saveFb: function () {
      var fb = state.fb;
      if (!fb.rating) {
        logEvent('validation_error', { errorType: 'feedback_score_missing' });
        set({ fbErr: true, fbSaved: false }); focusLater('rate-1'); return;
      }
      logEvent('feedback_saved', { score: fb.rating });
      flash.fbSaved = true;
      set({ fbSaved: true, fbErr: false, fbData: { score: fb.rating, comment: fb.comment.trim(), savedAt: new Date().toISOString() } });
    },
    export: exportSession,
    editInput: function () {
      logEvent('entry_opened', { from: 'edit_input' });
      set({ screen: 'entry', notice: null, resetArmed: false, errors: {} }, { noRestore: true });
      window.scrollTo(0, 0); focusLater('reviews');
    },
    reset: function () {
      if (!state.resetArmed) { set({ resetArmed: true }); return; }
      events = [];
      logEvent('session_reset');
      logEvent('entry_opened', { from: 'reset' });
      set(Object.assign(blank(), { notice: 'reset' }), { noRestore: true });
      window.scrollTo(0, 0); focusLater('venue');
    },
    resetCancel: function () { set({ resetArmed: false }, { noRestore: true }); focusLater('resetBtn'); }
  };

  root.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]');
    if (!b || !root.contains(b)) return;
    var fn = ACTIONS[b.getAttribute('data-action')];
    if (fn) fn(b.getAttribute('data-v'));
  });

  root.addEventListener('submit', function (ev) {
    if (ev.target.id === 'entryForm') { ev.preventDefault(); submit(); }
  });

  // Typing does not re-render (keeps caret and IME state); an existing error triggers one refresh to clear it.
  root.addEventListener('input', function (ev) {
    var el = ev.target, id = el.id;
    if (id === 'venue') {
      state.venue = el.value; state.notice = null;
      if (state.errors.venue) set({ errors: without(state.errors, 'venue') });
    } else if (id === 'reviews') {
      var wasDemo = isDemoInput();
      state.raw = el.value; state.notice = null;
      if (state.errors.reviews || wasDemo !== isDemoInput()) set({ errors: without(state.errors, 'reviews') });
      else {
        var p = parse(state.raw), c = document.getElementById('counterText');
        if (c) c.textContent = p.lines ? tf('counter', { lines: p.lines, u: p.uniq.length, d: p.dupes }) : t().counterEmpty;
      }
    } else if (id === 'person') {
      state.act = Object.assign({}, state.act, { person: el.value });
      if (state.actErr.person && el.value.trim()) set({ actErr: without(state.actErr, 'person') });
    } else if (id === 'date') {
      state.act = Object.assign({}, state.act, { date: el.value });
      if (state.actErr.date && el.value) set({ actErr: without(state.actErr, 'date') });
    } else if (id === 'comment') {
      state.fb = Object.assign({}, state.fb, { comment: el.value });
      if (state.fbSaved) set({ fbSaved: false });
    }
  });

  root.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.id === 'perm') set({ perm: el.checked, errors: without(state.errors, 'perm') });
    else if (el.name === 'actTopic') set({ act: Object.assign({}, state.act, { topic: el.value }), actErr: without(state.actErr, 'topic') });
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (state.openTopic && state.screen === 'results') { ev.preventDefault(); closeEvidence(); }
    else if (state.resetArmed) { ev.preventDefault(); ACTIONS.resetCancel(); }
  });

  /* ======================================================================
   * PRESETS (?preset=…) — used by screens.html to show each state; not logged.
   * ==================================================================== */
  function applyPreset(p) {
    if (!p || p === 'blank') return;
    var base = blank(), demo = p === 'empty' ? DEMO_EMPTY : DEMO;
    if (p === 'demo-input') { Object.assign(state, base, { venue: demo.venue, raw: demo.raw }); return; }
    if (p === 'errors') {
      Object.assign(state, base, { raw: demo.raw.split('\n').slice(0, 2).join('\n'), errors: { venue: 'errVenue', reviews: { code: 'few', u: 2 }, perm: true } });
      return;
    }
    var pr = parse(demo.raw), result = analyze(pr.uniq, pr.dupes, pr.lines);
    var st = Object.assign(base, { venue: demo.venue, raw: demo.raw, perm: true, result: result, screen: 'results',
      openTopic: p === 'results' && result.topics[0] ? result.topics[0].id : null, showAll: p === 'empty' });
    if (p === 'action-hint') st.actErr = { topic: true, person: true, date: true };
    if (p === 'saved' && result.topics[1]) {
      st.act = { topic: result.topics[1].id, person: 'Айгерім', date: localIso(7) };
      st.actSaved = Object.assign({ savedAt: new Date().toISOString() }, st.act);
      st.fb = { rating: 4, comment: '' }; st.fbSaved = true; st.fbData = { score: 4, comment: '', savedAt: new Date().toISOString() };
    }
    Object.assign(state, st);
  }

  /* ======================================================================
   * BOOT
   * ==================================================================== */
  var preset = params.get('preset');
  applyPreset(preset);
  logEvent('entry_opened', { from: 'page_load' });
  state.narrow = root.getBoundingClientRect().width < 760;
  render({});
  if (preset === 'action-hint' || preset === 'saved') setTimeout(function () { scrollToEl(document.getElementById('actSection')); }, 80);

  if (window.ResizeObserver) {
    new ResizeObserver(function (en) {
      var n = en[0].contentRect.width < 760;
      if (n !== state.narrow) set({ narrow: n });
    }).observe(root);
  }

  // Test hook (read-only): lets automated checks inspect the export without downloading.
  window.ReviewIQ = { version: VERSION, buildExport: function () { return state.result ? buildExport() : null; }, i18n: i18n, topics: TOPICS };
})();
</script>
